<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creamdo Art · Galería en Lechería, Venezuela</title>
<meta name="description" content="Creamdo Art, por Adriana Moncayo. Galería y representación de artistas en Lechería, Venezuela: pinturas, esculturas y arte sacro con medidas y precio a la vista.">
<meta property="og:title" content="Creamdo Art">
<meta property="og:description" content="Galería y representación de artistas en Lechería, Venezuela.">
<meta property="og:type" content="website">
<meta property="og:image" content="marca/logo.png">
<link rel="icon" type="image/svg+xml" href="marca/favicon.svg?v=2">
<link rel="alternate icon" type="image/png" href="marca/favicon.png?v=2">
<link rel="apple-touch-icon" href="marca/favicon-180.png?v=2">
<link rel="preload" href="marca/archivo.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* La identidad sale del logo: negro, blanco y tres rayas diagonales (cian, naranja, magenta).
   Una sola familia, Archivo. El peso grueso y ancho queda solo en el logotipo;
   el resto del texto va pequeño y tranquilo para que mande la obra. */
@font-face{font-family:Archivo;src:url(marca/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{
  --blanco:#FFFFFF; --negro:#0A0A0B; --gris:#626266; --linea:#E2E2DF; --papel:#F4F4F1;
  --cian:#009ED8; --naranja:#F26122; --magenta:#EC1163;
  --inclinacion:22deg;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--blanco);color:var(--negro);font:400 16px/1.55 Archivo,"Helvetica Neue",Arial,sans-serif}
a{color:inherit}
img{display:block;max-width:100%}
.ancho{max-width:1240px;margin:0 auto;padding:0 20px}
@media(min-width:900px){.ancho{padding:0 40px}}
a:focus-visible,button:focus-visible{outline:3px solid var(--cian);outline-offset:3px}
.etiqueta{font-weight:650;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
/* las tres rayas del logo */
.rayas{display:inline-flex;gap:5px;transform:skewX(var(--inclinacion));vertical-align:middle}
.rayas i{display:block;width:7px;height:26px}
.rayas i:nth-child(1){background:var(--cian)}.rayas i:nth-child(2){background:var(--naranja)}.rayas i:nth-child(3){background:var(--magenta)}

header.sitio .ancho{display:flex;justify-content:space-between;align-items:center;gap:14px 24px;padding-top:16px;padding-bottom:16px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:14px;text-decoration:none}
.marca img{height:46px;width:auto}
.marca b{font-weight:900;font-stretch:125%;font-size:19px;letter-spacing:.3em;line-height:1;display:block}
.marca span{font-weight:200;font-size:13px;letter-spacing:.62em;display:block;margin-top:5px}
nav{display:flex;gap:10px 26px;align-items:center;flex-wrap:wrap}
.idiomas{display:inline-flex;gap:2px;border-left:1px solid var(--linea);padding-left:18px}
@media(max-width:560px){nav{width:100%;gap:8px 16px}nav a{font-size:12px;letter-spacing:.14em}.idiomas{margin-left:auto;border-left:0;padding-left:0}}
.idiomas button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;font:inherit;font-weight:400;font-size:12.5px;letter-spacing:.14em;color:var(--gris);padding:8px 5px}
.idiomas button[aria-pressed=true]{color:var(--negro);font-weight:650}
.idiomas button:hover{color:var(--negro)}
nav a{text-decoration:none;font-weight:650;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;padding:8px 0;border-bottom:3px solid transparent}
nav a:hover{border-bottom-color:var(--linea)}
nav a[aria-current=page]{border-bottom-color:var(--negro)}
main{min-height:60vh}

/* portada */
.portada{display:grid;gap:30px;padding:26px 0 54px;border-top:1px solid var(--negro)}
.portada h1{margin:0;font-weight:300;font-size:clamp(30px,4vw,52px);line-height:1.1;letter-spacing:-.015em;max-width:16ch}
.portada .texto{max-width:40ch;font-size:17px;color:var(--gris);margin:20px 0 0}
.portada .rayas{margin-top:28px}
.destacada{display:block;text-decoration:none;justify-self:start}
.destacada img{width:auto;max-width:100%;height:auto;max-height:min(66vh,560px);background:var(--papel)}
.destacada p{margin:10px 0 0;font-size:14px;color:var(--gris)}
.destacada p b{color:var(--negro);font-weight:650}
.destacada .etiqueta{display:block;font-size:11px;color:var(--magenta);margin-bottom:4px}
@media(min-width:900px){.portada{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;padding:56px 0 84px;align-items:center}.destacada{justify-self:end}}

.cabecera-seccion{display:flex;justify-content:space-between;align-items:baseline;gap:10px 30px;flex-wrap:wrap;border-top:1px solid var(--negro);padding:14px 0 30px}
.cabecera-seccion h2{margin:0;font-weight:650;font-size:12px;letter-spacing:.2em;text-transform:uppercase;line-height:1.6}
.filtros{display:flex;gap:6px 22px;flex-wrap:wrap}
.filtros a{text-decoration:none;font-weight:650;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);padding:5px 0;border-bottom:3px solid transparent}
.filtros a[aria-current=true]{color:var(--negro);border-bottom-color:var(--magenta)}

/* muro de obras: columnas desfasadas, como una pared colgada a mano */
.muro{display:grid;gap:52px 0;padding-bottom:70px}
@media(min-width:620px){.muro{grid-auto-flow:column;grid-auto-columns:1fr;gap:0 44px;align-items:start}.muro .col:nth-child(2){padding-top:84px}.muro .col:nth-child(3){padding-top:36px}}
.col{display:grid;gap:52px;align-content:start}
@media(min-width:620px){.col{gap:68px}}
.pieza{display:block;text-decoration:none}
.marco{display:block;overflow:hidden;background:var(--papel)}
.pieza img{width:100%;height:auto;min-height:80px;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.pieza:hover img{transform:scale(1.035)}
.pieza h3{margin:14px 0 2px;font-weight:600;font-size:18px;line-height:1.3}
.pieza p{margin:0;font-size:15px;color:var(--gris);line-height:1.5}
.pieza .artista{color:var(--negro)}
.pieza .precio{color:var(--negro);font-weight:650;margin-top:6px}
.pieza:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--magenta)}
.vendida{font-weight:650;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--magenta);margin-top:6px}
.vacio{padding:10px 0 80px;max-width:52ch}
.vacio h3{font-weight:300;font-size:28px;margin:0 0 10px}

/* qué hacemos: banda negra a todo el ancho */
.banda{background:var(--negro);color:var(--blanco);margin:0 calc(50% - 50vw);padding:64px calc(50vw - 50%) 70px}
.banda .frase{font-weight:300;font-size:clamp(22px,2.6vw,34px);line-height:1.25;max-width:28ch;margin:18px 0 44px}
.banda ul{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid #3A3A3D}
@media(min-width:760px){.banda ul{grid-template-columns:repeat(3,1fr);border-top:0;gap:40px}}
.banda li{padding:18px 0;border-bottom:1px solid #3A3A3D}
@media(min-width:760px){.banda li{border-bottom:0;border-top:1px solid #3A3A3D;padding:20px 0 0}}
.banda li b{display:flex;align-items:center;gap:14px;font-weight:600;font-size:17px}
.banda li b i{display:block;width:7px;height:20px;transform:skewX(var(--inclinacion));flex:none;margin-left:5px}
.banda li span{display:block;color:#B9B9BD;font-size:14.5px;margin-top:6px}
.banda .artistas-cta{display:inline-block;margin-top:44px;font-weight:650;font-size:13px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;border-bottom:3px solid var(--naranja);padding-bottom:6px}

/* artistas */
.lista-artistas{list-style:none;margin:0 0 80px;padding:0}
.lista-artistas li{border-bottom:1px solid var(--linea)}
.lista-artistas a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 0;text-decoration:none}
.lista-artistas b{font-weight:400;font-size:clamp(20px,2.4vw,28px);line-height:1.2}
.lista-artistas span{font-size:13px;color:var(--gris);white-space:nowrap;letter-spacing:.1em;text-transform:uppercase}
.lista-artistas a:hover b{color:var(--magenta)}
.titulo-pagina{margin:0;padding:30px 0 30px;border-top:1px solid var(--negro);font-weight:300;font-size:clamp(28px,3.6vw,44px);line-height:1.1;letter-spacing:-.01em}

/* ficha de obra */
.volver{display:inline-block;margin:0;padding:18px 0;font-weight:650;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);text-decoration:none}
.volver:hover{color:var(--negro)}
.ficha{display:grid;gap:30px;border-top:1px solid var(--negro);padding:26px 0 80px}
@media(min-width:900px){.ficha{grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);column-gap:64px;row-gap:0;align-items:start;padding-top:40px}.ficha .primera,.ficha .resto{grid-column:1}.ficha aside{grid-column:2;grid-row:1 / span 2;position:sticky;top:26px}}
.ficha figure{margin:0 0 30px}
.ficha figure img{width:auto;max-width:100%;height:auto;max-height:84vh;background:var(--papel) center/cover no-repeat}
.ficha figcaption{font-size:13px;color:var(--gris);margin-top:9px}
.ficha h1{margin:0 0 6px;font-weight:600;font-size:clamp(28px,3.2vw,42px);line-height:1.12;letter-spacing:-.01em;overflow-wrap:anywhere}
.ficha .artista{display:inline-block;font-weight:300;font-size:20px;text-decoration:none;margin-bottom:26px;border-bottom:1px solid var(--linea)}
.ficha .artista:hover{border-bottom-color:var(--negro)}
dl{margin:0 0 28px;border-top:1px solid var(--negro)}
dl div{display:grid;grid-template-columns:108px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--linea);font-size:15px}
dt{font-weight:650;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);padding-top:3px}
dd{margin:0}
.precio-grande{font-weight:600;font-size:26px;line-height:1;margin:0 0 22px}
.boton{display:flex;justify-content:space-between;align-items:center;gap:14px;text-decoration:none;font-weight:650;font-size:13px;letter-spacing:.16em;text-transform:uppercase;padding:19px 22px;background:var(--negro);color:var(--blanco);border:1px solid var(--negro);transition:background .25s,color .25s;margin-bottom:14px}
.boton:hover{background:var(--blanco);color:var(--negro)}   /* fondo blanco: las tres rayas siguen viéndose */
.boton .rayas i{height:20px;width:6px}
.nota{font-size:13.5px;color:var(--gris);margin:0}

footer{border-top:1px solid var(--negro)}
footer .ancho{display:flex;justify-content:space-between;align-items:flex-end;gap:24px 40px;flex-wrap:wrap;padding-top:34px;padding-bottom:44px}
footer img{width:150px;height:auto}
footer p{margin:0 0 4px;font-size:14px;color:var(--gris)}
footer .enlaces{display:flex;gap:22px;margin-top:12px}
footer .enlaces a{font-weight:650;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border-bottom:3px solid var(--negro);padding-bottom:4px}
footer .enlaces a:nth-child(1){border-color:var(--cian)}footer .enlaces a:nth-child(2){border-color:var(--naranja)}footer .enlaces a:nth-child(3){border-color:var(--magenta)}

/* movimiento: solo tres gestos, y ninguno si la persona pidió menos movimiento */
@media(prefers-reduced-motion:no-preference){
  /* 1. las obras se descubren al llegar a ellas, como al quitar la tela */
  .mov .pieza .marco,.mov .destacada .marco{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.2,.7,.2,1)}
  .mov .pieza .marco img,.mov .destacada .marco img{transform:scale(1.12)}
  .mov .pieza h3,.mov .pieza p,.mov .destacada p{opacity:0;transform:translateY(10px);transition:opacity .6s ease .45s,transform .6s ease .45s}
  .mov .a-la-vista .marco{clip-path:inset(0)}
  .mov .a-la-vista .marco img{transform:none;transition:transform 1.5s cubic-bezier(.2,.7,.2,1)}
  .mov .pieza.a-la-vista:hover .marco img{transform:scale(1.035);transition-duration:.9s}
  .mov .a-la-vista h3,.mov .a-la-vista p{opacity:1;transform:none}
  /* 2. las tres rayas del logo se trazan una tras otra */
  .portada .rayas i{transform-origin:bottom;animation:trazo .7s cubic-bezier(.2,.7,.2,1) both}
  .portada .rayas i:nth-child(2){animation-delay:.12s}.portada .rayas i:nth-child(3){animation-delay:.24s}
  .portada h1,.portada .texto{animation:subir .8s cubic-bezier(.2,.7,.2,1) both}.portada .texto{animation-delay:.1s}
  .boton .rayas i{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
  .boton:hover .rayas i:nth-child(1){transform:translateY(-4px)}.boton:hover .rayas i:nth-child(3){transform:translateY(4px)}
  /* 3. al abrir una obra, la foto viaja de la pared a la ficha */
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.3s}
  ::view-transition-group(obra){animation-duration:.55s;animation-timing-function:cubic-bezier(.3,.7,.2,1)}
  ::view-transition-old(obra),::view-transition-new(obra){height:100%;object-fit:cover}
}
@keyframes trazo{from{transform:scaleY(0)}}
@keyframes subir{from{opacity:0;transform:translateY(14px)}}
</style>
</head>
<body>
<header class="sitio">
  <div class="ancho">
    <a class="marca" href="#/" aria-label="Creamdo Art, inicio">
      <img src="marca/monograma.png" alt="" width="480" height="303">
      <div><b>CREAMDO</b><span>ART</span></div>
    </a>
    <nav aria-label="Secciones">
      <a href="#/" id="n-obras">Obras</a>
      <a href="#/artistas" id="n-artistas">Artistas</a>
      <a href="#" id="n-contacto" target="_blank" rel="noopener">WhatsApp</a>
      <span class="idiomas" role="group" aria-label="Idioma / Language"><button type="button" data-idioma="es" lang="es" aria-label="Español">ES</button><button type="button" data-idioma="en" lang="en" aria-label="English">EN</button></span>
    </nav>
  </div>
</header>
<main class="ancho" id="vista" aria-live="polite"></main>
<footer>
  <div class="ancho">
    <img src="marca/logo.png" alt="Creamdo Art" width="560" height="503" loading="lazy">
    <div>
      <p id="f-firma">Creamdo Art, por Adriana Moncayo.</p>
      <p>Lechería, Anzoátegui, Venezuela.</p>
      <div class="enlaces"><a href="#" id="f-whatsapp" target="_blank" rel="noopener">WhatsApp</a><a href="#" id="f-instagram" target="_blank" rel="noopener">Instagram</a><a href="https://www.tiktok.com/@creamdo.art" target="_blank" rel="noopener">TikTok</a></div>
    </div>
  </div>
</footer>
<script src="config.js?v=9"></script>
<script src="tienda.js?v=9"></script>
</body>
</html>
