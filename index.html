<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creamdo Art · Galería en Lechería, Venezuela</title>
<meta name="description" content="Galería y representación de artistas en Lechería, Venezuela. Pinturas, esculturas y arte sacro, con medidas y precio a la vista.">
<meta property="og:title" content="Creamdo Art">
<meta property="og:description" content="Galería y representación de artistas en Lechería, Venezuela.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23201A14'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23F7F4EE' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#F7F4EE; --tinta:#201A14; --gris:#6E6457; --linea:#D8CFC0; --terracota:#A9472B; --terracota2:#8C3820;
  --titulo:"Cormorant Garamond","Iowan Old Style",Georgia,serif; --texto:"Instrument Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.55 var(--texto)}
a{color:inherit}
img{display:block;max-width:100%}
.ancho{max-width:1180px;margin:0 auto;padding:0 20px}
header.sitio{border-bottom:1px solid var(--tinta)}
header.sitio .ancho{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:22px;padding-bottom:14px;flex-wrap:wrap}
.marca{font:600 26px/1 var(--titulo);letter-spacing:.16em;text-decoration:none}
.marca small{font:400 12px/1 var(--texto);letter-spacing:.2em;display:block;margin-top:6px;color:var(--gris)}
nav{display:flex;gap:22px;font-size:14.5px}
nav a{text-decoration:none;padding:6px 0;border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current=page]{border-bottom-color:var(--tinta)}
a:focus-visible,button:focus-visible{outline:2px solid var(--terracota);outline-offset:3px}
main{min-height:60vh;padding-bottom:70px}
.entrada{padding:54px 0 34px;max-width:760px}
.entrada h1{font:500 clamp(40px,7vw,68px)/1.02 var(--titulo);margin:0 0 16px}
.entrada h1 em{font-style:italic}
.entrada p{font-size:17px;color:var(--gris);margin:0;max-width:56ch}
.filtros{display:flex;gap:6px 18px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);margin-bottom:34px;font-size:14.5px}
.filtros a{text-decoration:none;color:var(--gris);padding:4px 0}
.filtros a[aria-current=true]{color:var(--tinta);border-bottom:1px solid var(--tinta)}
.muro{columns:2;column-gap:22px}
@media(min-width:760px){.muro{columns:3;column-gap:34px}}
.pieza{break-inside:avoid;margin:0 0 38px;display:block;text-decoration:none}
.pieza img{width:100%;height:auto;background:#EBE5D9;min-height:90px}
.pieza h2{font:500 22px/1.15 var(--titulo);margin:12px 0 2px}
.pieza p{margin:0;font-size:13.5px;color:var(--gris);line-height:1.45}
.pieza .precio{color:var(--tinta);margin-top:4px}
.vendida{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--terracota)}
.pieza:hover h2{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.vacio{padding:60px 0;max-width:54ch}
.vacio h2{font:500 32px/1.1 var(--titulo);margin:0 0 10px}
/* ficha de obra */
.volver{display:inline-block;margin:26px 0 18px;font-size:14px;color:var(--gris);text-decoration:none}
.volver:hover{color:var(--tinta)}
.ficha{display:grid;gap:34px}
@media(min-width:900px){.ficha{grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);column-gap:56px;row-gap:0;align-items:start}.ficha .primera,.ficha .resto{grid-column:1}.ficha aside{grid-column:2;grid-row:1 / span 2;position:sticky;top:24px}}
.ficha figure{margin:0 0 26px}
.ficha figure img{width:100%;height:auto;background:#EBE5D9}
.ficha figcaption{font-size:12.5px;color:var(--gris);margin-top:8px}
.ficha h1{font:500 clamp(34px,5vw,50px)/1.04 var(--titulo);margin:0 0 6px}
.ficha .artista{font:italic 500 23px/1.2 var(--titulo);text-decoration:none;display:inline-block;margin-bottom:22px}
.ficha .artista:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
dl{margin:0 0 26px;border-top:1px solid var(--linea)}
dl div{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--linea);font-size:15px}
dt{color:var(--gris)}
dd{margin:0}
.precio-grande{font:500 34px/1 var(--titulo);margin:0 0 20px}
.boton{display:block;text-align:center;text-decoration:none;font:600 16px/1 var(--texto);padding:18px 16px;border-radius:2px;background:var(--terracota);color:#FBF8F2;margin-bottom:12px}
.boton:hover{background:var(--terracota2)}
.nota{font-size:13.5px;color:var(--gris);margin:0}
/* artistas */
.lista-artistas{list-style:none;margin:0;padding:0;border-top:1px solid var(--tinta)}
.lista-artistas li{border-bottom:1px solid var(--linea)}
.lista-artistas a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px 0;text-decoration:none}
.lista-artistas b{font:500 clamp(26px,4vw,38px)/1.1 var(--titulo)}
.lista-artistas span{font-size:13.5px;color:var(--gris);white-space:nowrap}
.lista-artistas a:hover b{font-style:italic}
footer{border-top:1px solid var(--tinta);padding:26px 0 40px;font-size:14px;color:var(--gris)}
footer .ancho{display:flex;justify-content:space-between;gap:14px 30px;flex-wrap:wrap}
footer a{color:var(--tinta)}
</style>
</head>
<body>
<header class="sitio">
  <div class="ancho">
    <a class="marca" href="#/">CREAMDO<small>ARTE · LECHERÍA</small></a>
    <nav aria-label="Secciones">
      <a href="#/" id="n-obras">Obras</a>
      <a href="#/artistas" id="n-artistas">Artistas</a>
      <a href="#" id="n-contacto" target="_blank" rel="noopener">Escríbenos</a>
    </nav>
  </div>
</header>
<main class="ancho" id="vista" aria-live="polite"></main>
<footer>
  <div class="ancho">
    <span>Creamdo Art, por Adriana Moncayo. Lechería, Anzoátegui, Venezuela.</span>
    <span><a href="#" id="f-whatsapp" target="_blank" rel="noopener">WhatsApp</a> · <a href="#" id="f-instagram" target="_blank" rel="noopener">Instagram</a></span>
  </div>
</footer>
<script src="config.js"></script>
<script src="tienda.js"></script>
</body>
</html>
